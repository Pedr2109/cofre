<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo do Cofre</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cofre-container">
    <h1>🔒 Cofre Digital</h1>
    <p class="instrucoes">Descubra a senha de 4 dígitos únicos. Você tem <span id="tentativas-restantes">6</span> tentativas.</p>

    <div class="visor" id="visor">----</div>

    <div class="teclado">
      <button class="tecla" onclick="digitar('1')">1</button>
      <button class="tecla" onclick="digitar('2')">2</button>
      <button class="tecla" onclick="digitar('3')">3</button>
      <button class="tecla" onclick="digitar('4')">4</button>
      <button class="tecla" onclick="digitar('5')">5</button>
      <button class="tecla" onclick="digitar('6')">6</button>
      <button class="tecla" onclick="digitar('7')">7</button>
      <button class="tecla" onclick="digitar('8')">8</button>
      <button class="tecla" onclick="digitar('9')">9</button>
      <button class="tecla acao limpar" onclick="limpar()">C</button>
      <button class="tecla" onclick="digitar('0')">0</button>
      <button class="tecla acao confirmar" onclick="verificarSenha()">OK</button>
    </div>

    <p id="mensagem" class="mensagem"></p>

    <div class="historico-container">
      <h3>Histórico de Tentativas</h3>
      <ul id="historico"></ul>
    </div>

    <button id="btn-reiniciar" class="btn-reiniciar hidden" onclick="iniciarJogo()">Jogar Novamente</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
